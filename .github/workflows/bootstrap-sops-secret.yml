name: SOPS 비밀값 최초 변환

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-env-vars:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: SOPS 설치
        uses: ./.github/actions/setup-sops

      - name: 기존 ENV_VARS를 암호화된 Kubernetes Secret으로 변환
        env:
          ENV_VARS: ${{ secrets.ENV_VARS }}
        run: |
          python3 scripts/create_kubernetes_secret.py k8s/dup-env.sops.yaml
          sops --encrypt --in-place k8s/dup-env.sops.yaml

      - name: 암호화 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/dup-env.sops.yaml
          git diff --cached --quiet || git commit -m "운영 환경 비밀값 암호화"
          git push

name: Deploy to Kubernetes

on:
  push:
    branches:
      - main # `main` 브랜치에 push 될 때 실행
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production # 🔥 환경별 설정 (GitHub Environment Secrets 사용)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Kubernetes Secret 준비
        env:
          ENV_VARS: ${{ secrets.ENV_VARS }}
        run: |
          python3 scripts/create_kubernetes_secret.py k8s/dup-env.yaml

      - name: Kubernetes Secret 전달
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: k8s/dup-env.yaml
          target: /tmp

      # 2️⃣ Docker 로그인 (GitHub 또는 Docker Hub)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Docker 이미지 빌드 및 푸시
      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME=tttuer/dup
          TAG=latest
          docker build -t $IMAGE_NAME:$TAG .
          docker push $IMAGE_NAME:$TAG
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      # K3s에는 Secret만 전달하고, Docker 이미지는 코드만 담는다.
      - name: Deploy to K3s
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            kubectl apply -f /tmp/k8s/dup-env.yaml
            rm -rf /tmp/k8s
            kubectl set env deployment/dup --from=secret/dup-env
            kubectl rollout restart deployment/dup
            echo "✅ 배포 완료!"
